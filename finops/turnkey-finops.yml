meters:
- name: signatures
  description: Signing activities (sign_transaction, sign_raw_payload(s)) billed per signature; 25/month free, then $0.0015-$0.10 per signature by tier.
  unit: signatures
  aggregation: sum
  dimensions:
  - organization
  - subOrganization
  - plan
- name: wallets
  description: Active wallets counted against the plan wallet cap (Free 100, PAYG 1,000, Pro 2,000, Enterprise unlimited).
  unit: wallets
  aggregation: max
  dimensions:
  - organization
  - subOrganization
- name: monthly_minimum
  description: Flat $99/month minimum charge on the Pro plan, independent of signature volume.
  unit: subscription
  aggregation: max
  dimensions:
  - organization
  - plan
principles:
- name: Visibility
  description: Track signature volume per organization and sub-organization; signatures are the dominant cost driver.
- name: Allocation
  description: Map sub-organizations and wallet sets to internal cost centers / end users for chargeback.
- name: Optimization
  description: Batch raw payloads where possible, right-size the plan tier to signature volume, and negotiate Enterprise rates at scale (down to $0.0015/signature).
- name: Accountability
  description: Assign owners per sub-organization; review monthly signature spend against the $99 Pro minimum and free-signature allotment.
