description: >-
  FinOps view of Turnkey spend. Turnkey bills primarily per signature (per
  transaction) against a declining per-signature rate that depends on plan
  tier (PAYG $0.10, Pro $0.05, Enterprise as low as $0.0015), plus a $99/month
  minimum on Pro. The Free tier covers 100 wallets and 25 free signatures per
  month. Wallet count is plan-capped rather than directly metered, so the
  dominant cost driver is signature volume.
notes: >-
  Per-signature rates and the monthly minimum are subject to change; verify
  against the Turnkey pricing page during reconciliation.
sources:
- https://www.turnkey.com/pricing
- https://docs.turnkey.com
